name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Verify all cogs load
        run: |
          python - <<'PY'
          import asyncio, os
          os.environ["MCCAP_TOKEN"] = "ci"
          import discord
          from discord.ext import commands
          from mccapbot.bot import EXTENSIONS

          async def main():
              intents = discord.Intents.default()
              intents.message_content = False
              bot = commands.Bot(command_prefix="!", intents=intents)
              for ext in EXTENSIONS:
                  await bot.load_extension(ext)
              names = sorted(c.qualified_name for c in bot.tree.get_commands())
              print(f"{len(names)} commands:", ", ".join(names))
              assert len(names) == 10, f"expected 10 slash commands, got {len(names)}"
              await bot.close()

          asyncio.run(main())
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mccap:ci .
