name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Verify all cogs load
        run: |
          python - <<'PY'
          import asyncio, os
          os.environ["MCCAP_TOKEN"] = "ci"
          import discord
          from discord.ext import commands
          from mccapbot.bot import EXTENSIONS

          async def main():
              intents = discord.Intents.default()
              intents.message_content = False
              bot = commands.Bot(command_prefix="!", intents=intents)
              for ext in EXTENSIONS:
                  await bot.load_extension(ext)
              names = sorted(c.qualified_name for c in bot.tree.get_commands())
              print(f"{len(names)} commands:", ", ".join(names))
              # Chat and scan watching are off in CI, so /memory and /scans are not registered.
              expected = sorted([
                  "mc", "mc_check", "mc_clear", "mc_list", "mc_lp", "mc_move", "mc_recent", "mc_remove", "mc_status",
                  "help", "rhc", "watch",
              ])
              assert names == expected, f"slash commands differ from the expected set: {sorted(set(names) ^ set(expected))}"
              await bot.close()

          asyncio.run(main())
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t mccap:ci .
